<style>
:root{--bg:#faf9f6;--ink:#252421;--muted:#77736a;--line:#e5e1d8;--accent:#c95b2a}
*{box-sizing:border-box}
html,body{min-height:100%}
body{max-width:900px;padding:0 24px 45px;margin:auto;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;line-height:1.7}
a{color:var(--ink)}a:hover{color:var(--accent)}
.site-header{margin:0}
.site-header-inner{padding-top:88px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:7px}
.site-title{font-size:34px;font-weight:600;letter-spacing:-.04em;text-decoration:none}
.site-subtitle{margin:0;color:var(--muted);font-size:16px}
.ember-icon{margin-top:22px;color:var(--accent);width:64px;height:48px}
.ember-icon svg{display:block;width:100%;height:100%}
.home-spacer{min-height:40vh}
.section-intro{padding-bottom:28px;border-bottom:1px solid var(--line);margin-bottom:10px}
.section-intro h1{font-size:48px;letter-spacing:-.04em;margin:5px 0 8px}
.intro-copy,.lead{color:var(--muted);max-width:650px}
.archive-item{padding:28px 0;border-bottom:1px solid var(--line)}
.archive-item h2{margin:4px 0;font-size:27px;letter-spacing:-.02em}
.item-type,.archive-meta{font:11px system-ui,sans-serif;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.item-summary{color:var(--muted);max-width:650px}
.single{max-width:720px;margin:0 auto}.single h1{font-size:52px;line-height:1.05;letter-spacing:-.04em}
.single-content{margin-top:35px}
blockquote{border:0;margin:35px 0;padding:0;font-size:30px;line-height:1.35;font-style:italic}
.video-frame{position:relative;padding-bottom:56.25%;height:0;margin:30px 0;overflow:hidden}
.video-frame iframe{position:absolute;width:100%;height:100%;border:0}
.source-link{margin-top:40px;font:13px system-ui,sans-serif}
.empty-state{padding:40px 0;color:var(--muted)}
.site-footer{border-top:0;margin-top:28vh;padding-top:20px;text-align:center}
.bottom-nav{display:flex;justify-content:center;gap:38px;flex-wrap:wrap}
.bottom-nav a{font:14px system-ui,sans-serif;text-decoration:none;color:var(--ink)}
.bottom-nav a:hover{color:var(--accent)}
@media(max-width:650px){body{padding:0 18px 35px}.site-header-inner{padding-top:58px}.site-title{font-size:30px}.site-subtitle{font-size:15px}.bottom-nav{gap:22px}.single h1,.section-intro h1{font-size:40px}}
</style>
